name: macOS Experimental Tests

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with ssh debugging enabled'
        required: false
        default: false

jobs:
  build_and_test:
    strategy:
      matrix:
        # Apple Silicon only (no Intel runners)
        os: [macos-latest]
        qt: [qt6]
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} arm64 ${{ matrix.qt }}
    # If it's not done in 90 minutes, something is wrong.
    # Default is 6 hours, which is a bit long to wait.
    timeout-minutes: 90
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: 'recursive'
    - name: Setup (detached) tmate ssh session if enabled
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      uses: mxschmitt/action-tmate@v3
      timeout-minutes: 15
      with:
        detached: true
        limit-access-to-actor: true
    - name: Workaround for https://github.com/actions/runner-images/issues/9966
      run: |
        brew unlink python3
        brew link --overwrite python3
    - name: Install Homebrew packages
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
      run: |
        export HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK=1
        ./scripts/macosx-build-homebrew.sh ${{ matrix.qt }}
    - name: Build OpenSCAD (Apple Silicon)
      run: |
        mkdir build
        cd build
        cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_UNITY_BUILD=OFF \
          -DEXPERIMENTAL=ON \
          -DSNAPSHOT=ON \
          -DUSE_CCACHE=OFF \
          -DUSE_BUILTIN_OPENCSG=ON
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        make -j$NUMCPU
    - name: Verify arm64-only binary
      run: |
        BIN=build/OpenSCAD.app/Contents/MacOS/OpenSCAD
        if [ ! -f "$BIN" ]; then
          BIN=build/openscad
        fi
        ARCHS=$(lipo -archs "$BIN")
        echo "Architectures: $ARCHS"
        if [ "$ARCHS" != "arm64" ]; then
          echo "Error: expected arm64-only binary, got: $ARCHS"
          exit 1
        fi
    - name: Run Test Suite
      # Disable pdf export test on macOS because Cairo >= 1.18 on Homebrew uses the
      # Quartz backend which doesn't have the Liberation Sans font we use.
      # Soft-fail known flaky SW-renderer cases on arm64 runners.
      continue-on-error: true
      run: |
        cd build
        export NUMCPU=$(($(sysctl -n hw.ncpu) * 3 / 2))
        ctest -j$NUMCPU -E pdfexporttest
    - name: Upload Test Result Report
      uses: actions/upload-artifact@v7
      if: ${{ always() }}
      with:
        name: Test Result Report (MacOS arm64 ${{ matrix.qt }})
        path: |
          build/Testing/Temporary/*_report.html
          build/Testing/Temporary/LastTest.log
